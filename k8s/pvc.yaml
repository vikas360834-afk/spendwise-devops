apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spendwise-data
  namespace: spendwise
  labels:
    app.kubernetes.io/name: spendwise
    app.kubernetes.io/part-of: spendwise-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
