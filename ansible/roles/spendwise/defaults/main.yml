---
# Defaults are intentionally minimal: group_vars/all.yml is the single
# source of truth for this playbook. These values keep the role usable
# on its own.
namespace: spendwise
app_name: spendwise
app_image: spendwise-ai:1.0.0
app_version: "1.0.0"
app_replicas: 2
app_env: production
app_port: 4000
service_port: 80
jwt_expires_in: 7d
ai_api_url: https://api.openai.com/v1/chat/completions
ai_model: gpt-4o-mini
data_dir: /app/backend/data
jwt_secret: spendwise-demo-jwt-secret-change-me
ai_api_key: ""
storage_class: local-path
storage_size: 1Gi
rollout_timeout: 180
rendered_dir: "{{ playbook_dir }}/.rendered"
kubectl_bin: kubectl
