---
- name: Verify that kubectl is available
  ansible.builtin.command: "{{ kubectl_bin }} version --client"
  register: kubectl_version
  changed_when: false
  failed_when: kubectl_version.rc != 0

- name: Show the kubectl client version
  ansible.builtin.debug:
    msg: "{{ kubectl_version.stdout_lines[0] }}"

- name: Create the directory for rendered manifests
  ansible.builtin.file:
    path: "{{ rendered_dir }}"
    state: directory
    mode: "0755"

- name: Render the namespace manifest
  ansible.builtin.template:
    src: namespace.yaml.j2
    dest: "{{ rendered_dir }}/00-namespace.yaml"
    mode: "0644"

- name: Render the ConfigMap manifest
  ansible.builtin.template:
    src: configmap.yaml.j2
    dest: "{{ rendered_dir }}/01-configmap.yaml"
    mode: "0644"
  notify: Restart SpendWise deployment

- name: Render the Secret manifest
  ansible.builtin.template:
    src: secret.yaml.j2
    dest: "{{ rendered_dir }}/02-secret.yaml"
    mode: "0600"

- name: Render the PersistentVolumeClaim manifest
  ansible.builtin.template:
    src: pvc.yaml.j2
    dest: "{{ rendered_dir }}/03-pvc.yaml"
    mode: "0644"

- name: Render the Deployment manifest
  ansible.builtin.template:
    src: deployment.yaml.j2
    dest: "{{ rendered_dir }}/04-deployment.yaml"
    mode: "0644"

- name: Render the Service manifest
  ansible.builtin.template:
    src: service.yaml.j2
    dest: "{{ rendered_dir }}/05-service.yaml"
    mode: "0644"

- name: Apply the namespace
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/00-namespace.yaml"
  register: ns_apply
  changed_when: "'unchanged' not in ns_apply.stdout"

- name: Apply the ConfigMap
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/01-configmap.yaml"
  register: cm_apply
  changed_when: "'unchanged' not in cm_apply.stdout"

- name: Apply the Secret
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/02-secret.yaml"
  register: secret_apply
  changed_when: "'unchanged' not in secret_apply.stdout"

- name: Apply the PersistentVolumeClaim
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/03-pvc.yaml"
  register: pvc_apply
  changed_when: "'unchanged' not in pvc_apply.stdout"

- name: Apply the Deployment
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/04-deployment.yaml"
  register: deploy_apply
  changed_when: "'unchanged' not in deploy_apply.stdout"

- name: Apply the Service
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} apply -f {{ rendered_dir }}/05-service.yaml"
  register: svc_apply
  changed_when: "'unchanged' not in svc_apply.stdout"

- name: Run pending handlers before verification
  # A ConfigMap change notifies the restart handler; flushing here makes
  # the rollout happen before the status checks below.
  ansible.builtin.meta: flush_handlers

- name: Wait for the Deployment rollout to finish
  ansible.builtin.command:
    cmd: >-
      {{ kubectl_bin }} -n {{ namespace }} rollout status
      deployment/{{ app_name }} --timeout={{ rollout_timeout }}s
  register: rollout_status
  changed_when: false

- name: Collect the deployed resources
  ansible.builtin.command:
    cmd: "{{ kubectl_bin }} -n {{ namespace }} get deploy,svc,pods -o wide"
  register: resource_status
  changed_when: false

- name: Show the deployed resources
  ansible.builtin.debug:
    msg: "{{ resource_status.stdout_lines }}"
